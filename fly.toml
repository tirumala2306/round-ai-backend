# fly.toml app configuration file generated for round-ai-backend on 2026-11-13T16:47:11Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'round-ai-backend'
primary_region = 'sin'

[build]
[env]
  DB_PATH = '/data/roundsai.db'
  NODE_ENV = 'production'
  PORT = '8080'

[[mounts]]
  source = 'roundsai_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
