app = "roundsai-api"
primary_region = "sin"

[build]

[env]
  PORT = "8080"
  DB_PATH = "/data/roundsai.db"
  NODE_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[mounts]
  source = "roundsai_data"
  destination = "/data"
